<!DOCTYPE html>
<html>
<head>
    <title>Contacts</title>
</head>
<body>
    <h1>Contacts</h1>

    <ul>
        {% for contact in contacts %}
            <li>
                {{ contact.name }} — {{ contact.email }}
                — {{ contact.phone }}
                ({{ contact.company|default:"No company" }})
            </li>
        {% empty %}
            <li>No contacts yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
